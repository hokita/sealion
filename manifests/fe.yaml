---
apiVersion: v1
kind: Service
metadata:
  name: fe-service
  namespace: sealion
  labels:
    app: sealion-fe
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30010
      protocol: TCP
      name: http
  selector:
    app: sealion-fe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealion-fe
  namespace: sealion
  labels:
    app: sealion-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sealion-fe
  template:
    metadata:
      labels:
        app: sealion-fe
    spec:
      containers:
        - name: fe
          image: ghcr.io/hokita/sealion-fe:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 240
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      restartPolicy: Always
