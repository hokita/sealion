---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: sealion
  labels:
    app: sealion-api
spec:
  type: NodePort
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30009
      protocol: TCP
      name: http
  selector:
    app: sealion-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sealion-api
  namespace: sealion
  labels:
    app: sealion-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sealion-api
  template:
    metadata:
      labels:
        app: sealion-api
    spec:
      containers:
        - name: api
          image: ghcr.io/hokita/sealion-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: sealion-config
                  key: NODE_ENV
            - name: DB_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: sealion-config
                  key: DB_ENDPOINT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sealion-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sealion-secrets
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: sealion-secrets
                  key: db-name
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      restartPolicy: Always
